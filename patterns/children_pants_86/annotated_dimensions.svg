<text x="45.00" y="875.00" font-size="18" fill="#24344a" text-anchor="start">HOW TO READ THIS SHEET</text>
<text x="45.00" y="906.00" font-size="14" fill="#24344a" text-anchor="start">Curved-edge labels are seam-walked lengths; dimension arrows connect endpoints.</text>
<text x="45.00" y="928.00" font-size="14" fill="#24344a" text-anchor="start">Front and back each cut as a mirrored pair. Two hem widths make the opening of ONE leg.</text>
<text x="45.00" y="950.00" font-size="14" fill="#24344a" text-anchor="start">Full shell crotch seam (front + back, excluding waistband): 41.50 cm.</text>
<text x="45.00" y="972.00" font-size="14" fill="#24344a" text-anchor="start">The body was measured over diaper and leggings. Baste and check standing, sitting and squatting.</text>
<text x="45.00" y="994.00" font-size="14" fill="#24344a" text-anchor="start">The drawing is a sizing snapshot, not a fitted guarantee or print-to-cut layout.</text>
